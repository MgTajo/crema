<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1e1712" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Crema — coffee, brewed social</title>
<style>
  /* ============================================================
     CREMA — warm, editorial coffee-craft aesthetic
     Cream canvas · espresso ink · golden "crema" accent
     Tokens are theme-aware: dark overrides under [data-theme=dark]
     ============================================================ */
  :root{
    --bg1:#efe4d6; --bg2:#e3d0ba; --bg3:#d9c3a8;
    --cream:#FBF6EF; --surface:#FFFFFF; --surface2:#F6EFE5; --surface3:#F0E7D9;
    --ink:#221812; --ink2:#5b4b3d; --muted:#9c8b78; --faint:#c8b9a6;
    --line:#ede3d5; --line2:#e2d5c2;
    --crema:#bd7a38; --crema-deep:#9a5f28; --crema-soft:#f3e3cf;
    --terra:#c15a3b; --like:#e2553d;
    --green:#5f7a52; --gold:#d9a441; --blue:#527a86;
    --mb1:#efe0cd; --mb2:#d9c3a6; --mb3:#cbb391;
    --scorebg:#ffffffee; --tabbarbg:#fffdfaf2;
    --jg1:#ffffff; --jg2:#fbf3e8;
    --st1:#fff4e0; --st2:#ffe6c2; --st3:#f4d9ac; --st4:#9a5f28;
    --pm1:#eef3e9; --pm2:#d8e5cf;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --sh-sm:0 1px 2px rgba(60,40,20,.06);
    --sh:0 6px 24px rgba(70,45,20,.10);
    --sh-lg:0 30px 70px rgba(60,38,15,.30);
    --r:18px;
  }
  :root[data-theme="dark"]{
    --bg1:#241a12; --bg2:#1d140d; --bg3:#171009;
    --cream:#1e1712; --surface:#2a211a; --surface2:#251d16; --surface3:#332822;
    --ink:#f3e9dd; --ink2:#c9b8a5; --muted:#95836f; --faint:#5f5142;
    --line:#372c22; --line2:#453729;
    --crema:#c98a4b; --crema-deep:#e0b070; --crema-soft:#3a2c1d;
    --terra:#d0694a; --green:#8fae7f; --blue:#7fa9b5;
    --mb1:#3a2d20; --mb2:#2c2114; --mb3:#241a0f;
    --scorebg:#2a211aee; --tabbarbg:#1e1712f2;
    --jg1:#2a211a; --jg2:#241a12;
    --st1:#3a2c1d; --st2:#332413; --st3:#4a3820; --st4:#e0b070;
    --pm1:#26301f; --pm2:#39482f;
    --sh-sm:0 1px 2px rgba(0,0,0,.25); --sh:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(1200px 700px at 15% -10%, #f6ecdd 0%, transparent 55%),
      radial-gradient(1000px 800px at 110% 10%, #e7cfae 0%, transparent 50%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 60%,var(--bg3));
    min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:26px 16px; -webkit-font-smoothing:antialiased;
  }
  :root[data-theme="dark"] body{
    background:
      radial-gradient(1200px 700px at 15% -10%, #2a2015 0%, transparent 55%),
      radial-gradient(1000px 800px at 110% 10%, #201409 0%, transparent 50%),
      linear-gradient(160deg,#191008,#120b06 60%,#0d0804);
  }
  button{font-family:var(--sans)}
  button:focus-visible,[data-action]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--crema); outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important; transition:none!important}}

  .stage{display:flex; align-items:center; gap:54px; max-width:1100px}
  .pitch{max-width:340px; display:none}
  @media(min-width:960px){ .pitch{display:block} }
  .pitch .mark{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  .pitch .mark b{font-family:var(--serif); font-size:34px; font-weight:600; letter-spacing:.5px; color:#3a2a1c}
  .pitch h1{font-family:var(--serif); font-weight:600; font-size:40px; line-height:1.08; margin:.1em 0 .35em; color:#33241a}
  .pitch p{color:#6a5847; font-size:16px; line-height:1.6; margin:0 0 22px}
  .pitch .tags{display:flex; flex-wrap:wrap; gap:8px}
  .pitch .tags span{background:#ffffffb0; border:1px solid #fff; color:#7a5a34; padding:6px 12px; border-radius:99px; font-size:12.5px; font-weight:600; box-shadow:var(--sh-sm)}
  :root[data-theme="dark"] .pitch .mark b,:root[data-theme="dark"] .pitch h1{color:#f3e9dd}
  :root[data-theme="dark"] .pitch p{color:#c9b8a5}
  :root[data-theme="dark"] .pitch .tags span{background:#ffffff12; border-color:#ffffff1f; color:#d9c2a0}

  .phone{position:relative; width:400px; height:min(880px,94vh); background:#1c140d; border-radius:52px; padding:11px;
    box-shadow:var(--sh-lg), 0 0 0 2px #2c2118, inset 0 0 0 2px #000; flex:none}
  .screen{position:relative; width:100%; height:100%; overflow:hidden; background:var(--cream); border-radius:42px; display:flex; flex-direction:column}
  @media(max-width:520px){ body{padding:0} .phone{width:100vw; height:100dvh; border-radius:0; padding:0} .screen{border-radius:0} }

  .statusbar{flex:none; height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:14px; font-weight:600; z-index:5}
  .statusbar .dots{display:flex; align-items:center; gap:5px}
  .statusbar .bat{width:22px; height:11px; border:1.4px solid var(--ink); border-radius:3px; position:relative}
  .statusbar .bat:after{content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:var(--ink); border-radius:0 2px 2px 0}
  .statusbar .bat i{position:absolute; inset:1.4px; width:70%; background:var(--ink); border-radius:1px}

  .appbar{flex:none; padding:6px 18px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(var(--cream),var(--cream) 70%, transparent); z-index:4}
  .appbar .title{font-family:var(--serif); font-size:26px; font-weight:600; letter-spacing:.3px; display:flex; align-items:center; gap:9px}
  .appbar .actions{display:flex; align-items:center; gap:8px}
  .iconbtn{position:relative; width:38px; height:38px; border-radius:50%; border:1px solid var(--line2); background:var(--surface); display:grid; place-items:center; color:var(--ink); cursor:pointer; box-shadow:var(--sh-sm); flex:none}
  .iconbtn:active{transform:scale(.94)}
  .ndot{position:absolute; top:5px; right:6px; width:9px; height:9px; border-radius:50%; background:var(--terra); border:2px solid var(--surface)}
  .streak{display:flex; align-items:center; gap:5px; background:linear-gradient(135deg,var(--st1),var(--st2)); border:1px solid var(--st3); color:var(--st4); font-weight:700; font-size:13px; padding:7px 11px; border-radius:99px; box-shadow:var(--sh-sm)}

  .view{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .view::-webkit-scrollbar{display:none}
  .pad{padding:2px 16px 20px}
  .section-h{display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 12px}
  .section-h h2{font-family:var(--serif); font-size:20px; font-weight:600; margin:0}
  .section-h a{font-size:12.5px; font-weight:600; color:var(--crema); cursor:pointer}

  .seg{display:flex; gap:4px; background:var(--surface2); border:1px solid var(--line); padding:4px; border-radius:99px; margin:2px 0 6px}
  .seg button{flex:1; border:0; background:transparent; padding:8px 6px; border-radius:99px; font-size:13px; font-weight:600; color:var(--ink2); cursor:pointer; white-space:nowrap}
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--sh-sm)}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh-sm); overflow:hidden; margin-bottom:16px}
  .p-head{display:flex; align-items:center; gap:10px; padding:11px 12px}
  .p-head .idwrap{display:flex; align-items:center; gap:10px; flex:1; min-width:0; cursor:pointer}
  .avatar{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; flex:none; box-shadow:inset 0 0 0 2px #ffffff55}
  .avatar.big{width:54px; height:54px; font-size:19px; margin:0 auto 8px}
  .p-head .who{flex:1; min-width:0}
  .p-head .who b{font-size:14.5px; display:flex; align-items:center; gap:5px}
  .p-head .who span{display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lvlchip{font-size:10px; font-weight:700; color:var(--crema-deep); background:var(--crema-soft); border:1px solid var(--st3); padding:1px 6px; border-radius:99px; letter-spacing:.2px}
  .followmini{font-size:12.5px; font-weight:700; color:var(--crema); background:none; border:0; cursor:pointer; padding:6px 4px}
  .followmini.on{color:var(--muted)}
  .kebab{color:var(--faint); cursor:pointer; font-size:20px; line-height:1; padding:0 4px; background:none; border:0}

  .media{position:relative; aspect-ratio:1/1; display:grid; place-items:center; overflow:hidden; cursor:pointer;
    background:radial-gradient(120% 120% at 30% 20%, var(--mb1), var(--mb2) 70%, var(--mb3))}
  .media svg.cup{width:74%; height:74%; filter:drop-shadow(0 12px 16px rgba(40,22,8,.28))}
  .media img.photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .media .score{position:absolute; top:12px; right:12px; background:var(--scorebg); backdrop-filter:blur(4px); border:1px solid var(--line); color:var(--ink); font-size:12px; font-weight:800; padding:6px 10px; border-radius:99px; box-shadow:var(--sh-sm); display:flex; gap:5px; align-items:center; cursor:pointer; z-index:2}
  .media .score b{color:var(--crema-deep)}
  .media .patt{position:absolute; bottom:12px; left:12px; background:#00000066; backdrop-filter:blur(3px); color:#fff; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:99px; letter-spacing:.2px}

  .p-act{display:flex; align-items:center; gap:6px; padding:10px 12px 4px}
  .act{display:flex; align-items:center; gap:6px; background:none; border:0; cursor:pointer; color:var(--ink); font-weight:600; font-size:13.5px; padding:6px 8px; border-radius:99px}
  .act:active{transform:scale(.9)}
  .act.liked{color:var(--like)}
  .act.saved{color:var(--crema-deep)}
  .grow{flex:1}
  .p-body{padding:2px 14px 14px}
  .p-body .cap{font-size:14px; line-height:1.5}
  .p-body .cap b{font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 2px}
  .chip{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink2); background:var(--surface2); border:1px solid var(--line); padding:5px 10px; border-radius:99px}
  .chip.tag{color:var(--crema-deep); background:var(--crema-soft); border-color:var(--st3); cursor:pointer}
  .chip.drinkchip{color:#fff; background:var(--crema); border-color:var(--crema)}
  .chip .g{width:12px; height:12px; opacity:.75}
  .mention{color:var(--crema-deep); font-weight:700; cursor:pointer}
  .recipe-btn{margin-top:10px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--ink2); background:var(--surface2); border:1px solid var(--line); padding:8px 12px; border-radius:12px; cursor:pointer}
  .recipe-panel{display:none; margin-top:10px; border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .recipe-panel.open{display:block}
  .recipe-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line)}
  .recipe-grid div{background:var(--surface); padding:10px 12px}
  .recipe-grid span{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700}
  .recipe-grid b{font-size:14px; font-weight:700}
  .recipe-bean{background:var(--surface2)!important; grid-column:1/3; display:flex; align-items:center; gap:8px}
  .recipe-mach{grid-column:1/3}
  .cmt-preview{margin-top:11px; font-size:13px; color:var(--ink2)}
  .cmt-preview .more{color:var(--muted); cursor:pointer; font-weight:600}
  .cmt-preview .one{margin-top:4px}
  .cmt-preview .one b{color:var(--ink); font-weight:700}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; cursor:pointer; font-weight:700; font-size:14px; padding:11px 16px; border-radius:13px; background:var(--crema); color:#fff; box-shadow:var(--sh-sm)}
  .btn:active{transform:scale(.97)}
  .btn.block{width:100%}
  .btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line2); box-shadow:none}
  .btn.sm{padding:8px 13px; font-size:13px; border-radius:11px}

  .search{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line2); border-radius:14px; padding:11px 13px; box-shadow:var(--sh-sm); margin:4px 0 6px}
  .search input{border:0; outline:0; background:none; font-size:14.5px; flex:1; color:var(--ink)}
  .hscroll{display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px 6px}
  .hscroll::-webkit-scrollbar{display:none}
  .ucard{flex:none; width:132px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh-sm); padding:14px 10px 12px; text-align:center}
  .ucard b{font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ucard span{font-size:11px; color:var(--muted); display:block; margin:2px 0 9px}
  .ch-card{flex:none; width:180px; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--sh-sm)}
  .ch-top{height:112px; display:grid; place-items:center; position:relative; cursor:pointer; background:radial-gradient(120% 120% at 30% 20%,var(--mb1),var(--mb2))}
  .ch-top svg{width:76px; height:76px; filter:drop-shadow(0 8px 10px rgba(40,22,8,.25))}
  .ch-top .ends{position:absolute; top:9px; right:9px; z-index:2; background:#0000006e; backdrop-filter:blur(2px); color:#fff; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px}
  .ch-b{padding:11px 12px}
  .ch-b h3{margin:0; font-size:15px; font-family:var(--serif); font-weight:600}
  .ch-b p{margin:3px 0 10px; font-size:12px; color:var(--muted)}
  .duel{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh-sm); overflow:hidden}
  .duel-row{display:flex}
  .duel-side{flex:1; cursor:pointer; position:relative}
  .duel-side .m{aspect-ratio:1/1; display:grid; place-items:center; overflow:hidden; position:relative; background:radial-gradient(120% 120% at 30% 20%,var(--mb1),var(--mb2))}
  .duel-side .m svg{width:78%; height:78%; filter:drop-shadow(0 8px 10px rgba(40,22,8,.22))}
  .duel-side .m img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .duel-side.pick:after{content:"✓ your vote"; position:absolute; inset:auto 0 0; background:var(--crema); color:#fff; font-size:11px; font-weight:700; text-align:center; padding:4px; z-index:2}
  .duel-mid{width:44px; display:grid; place-items:center; font-family:var(--serif); font-weight:700; color:var(--muted); background:var(--surface2); border-left:1px solid var(--line); border-right:1px solid var(--line)}
  .duel-bar{display:flex; height:34px; font-size:12px; font-weight:700; color:#fff}
  .duel-bar b{display:grid; place-items:center; transition:flex .5s ease}
  .duel-bar .a{background:var(--crema)} .duel-bar .b{background:var(--blue)}
  .lb{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh-sm); overflow:hidden}
  .lb-row{display:flex; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line)}
  .lb-row:last-child{border-bottom:0}
  .lb-row.me{background:var(--crema-soft)}
  .lb-row.click{cursor:pointer}
  .lb-rank{width:22px; font-family:var(--serif); font-weight:700; font-size:16px; color:var(--muted); text-align:center}
  .lb-rank.top{color:var(--gold)}
  .lb-row .who b{font-size:14px} .lb-row .who span{font-size:11.5px; color:var(--muted)}
  .lb-pts{font-weight:800; font-size:14px; color:var(--crema-deep)}
  .lb-pts small{font-weight:600; color:var(--muted); font-size:11px}

  .filters{display:flex; gap:8px; margin:2px 0 12px}
  .fchip{border:1px solid var(--line2); background:var(--surface); color:var(--ink2); font-size:12.5px; font-weight:700; padding:8px 13px; border-radius:99px; cursor:pointer}
  .fchip.on{background:var(--crema); border-color:var(--crema); color:#fff}
  .map{position:relative; height:190px; border-radius:16px; overflow:hidden; border:1px solid var(--line2); box-shadow:var(--sh-sm); margin-bottom:10px}
  .map svg{position:absolute; inset:0; width:100%; height:100%}
  .pin{position:absolute; transform:translate(-50%,-100%); cursor:pointer; filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
  .pin svg{width:30px; height:38px}
  .cafe-card{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:11px; box-shadow:var(--sh-sm); margin-bottom:11px; cursor:pointer}
  .cafe-thumb{width:58px; height:58px; border-radius:13px; flex:none; display:grid; place-items:center; color:#fff; font-family:var(--serif); font-weight:700; font-size:22px}
  .cafe-card .info{flex:1; min-width:0}
  .cafe-card .info b{font-size:15px; display:block}
  .cafe-card .info .meta{font-size:12px; color:var(--muted); margin-top:1px}
  .cafe-card .info .row2{display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap}
  .star{color:var(--gold); font-weight:800; font-size:12.5px}
  .promo{font-size:10.5px; font-weight:700; color:var(--green); background:var(--pm1); border:1px solid var(--pm2); padding:3px 8px; border-radius:99px}
  .cafe-card .aod{width:46px; height:46px; border-radius:10px; overflow:hidden; flex:none; display:grid; place-items:center; border:1px solid var(--line); position:relative;
    background:radial-gradient(120% 120% at 30% 20%,var(--mb1),var(--mb2))}
  .cafe-card .aod svg{width:100%; height:100%}
  .cafe-card .aod img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}

  .prof-top{display:flex; gap:15px; align-items:center; margin:6px 2px 4px}
  .prof-av{width:82px; height:82px; border-radius:50%; overflow:hidden; display:grid; place-items:center; flex:none; box-shadow:var(--sh); position:relative;
    background:radial-gradient(120% 120% at 30% 20%,var(--mb1),var(--mb2))}
  .prof-av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .prof-id b{font-family:var(--serif); font-size:23px; font-weight:600; line-height:1.1; display:block}
  .prof-id .h{color:var(--muted); font-size:13px; margin:2px 0 8px}
  .prof-id .lvl{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--crema-deep); background:var(--crema-soft); border:1px solid var(--st3); padding:5px 11px; border-radius:99px; cursor:pointer}
  .bio{font-size:13.5px; color:var(--ink2); line-height:1.5; margin:12px 2px 14px}
  .stats{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh-sm); overflow:hidden}
  .stats div{flex:1; text-align:center; padding:12px 6px; border-right:1px solid var(--line)}
  .stats div:last-child{border-right:0}
  .stats div.click{cursor:pointer}
  .stats b{display:block; font-family:var(--serif); font-size:20px; font-weight:600}
  .stats span{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px}

  .journey{background:linear-gradient(160deg,var(--jg1),var(--jg2)); border:1px solid var(--line2); border-radius:18px; box-shadow:var(--sh-sm); padding:15px 4px 6px; margin-top:6px; overflow:hidden}
  .journey h3{margin:0 12px 2px; font-family:var(--serif); font-size:18px; font-weight:600}
  .journey p.sub{margin:0 12px 6px; font-size:12.5px; color:var(--muted)}
  .jstats{display:flex; gap:8px; margin:2px 12px 12px}
  .jstats>div{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:9px 4px; text-align:center}
  .jstats b{display:block; font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.1}
  .jstats b i{font-style:normal; font-size:12px; color:var(--green)}
  .jstats span{font-size:10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px}

    <defs><radialGradient id="${gid}" cx="42%" cy="36%" r="68%"><stop offset="0%" stop-color="#b5814a"/><stop offset="52%" stop-color="#8a5a30"/><stop offset="100%" stop-color="#583722"/></radialGradient></defs>
    ${opts.noCup?'':`<circle cx="50" cy="50" r="48.5" fill="#fdf9f3"/><circle cx="50" cy="50" r="45" fill="#f0e6d6"/>`}
    <circle cx="50" cy="50" r="${opts.noCup?48:42}" fill="url(#${gid})"/>
    <g transform="translate(${dx} ${dy}) rotate(${rot} 50 50)" fill="${foam}" opacity="0.9">${artShapes(pattern,q,rnd,foam)}</g>
    <ellipse cx="42" cy="34" rx="20" ry="12" fill="#ffffff" opacity="0.07"/></svg>`;
}
function art(img,pattern,q,seed,alt){ return img?`<img class="photo" src="${img}" alt="${esc(alt||'coffee')}" loading="lazy">`:cupSVG(pattern||'none', q==null?0.9:q, seed); }

  if(!state.me)state.me=freshState().me; if(!state.me.favMilk)state.me.favMilk='Whole milk'; if(!state.challengeSubs)state.challengeSubs={};
 }catch(e){state=freshState();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){/* quota — session only */}}
function findPost(id){return state.posts.find(p=>p.id===id)||(state.myGallery||[]).find(p=>p.id===id);}
function applyMe(){USERS.me.name=state.me.name||USERS.me.name; USERS.me.city=state.me.city||USERS.me.city; USERS.me.bio=state.me.bio||'';}
function freshCreate(){return{drink:state.me.favDrink||'Cappuccino',pattern:'rosetta',caption:'',img:null,source:'home',cafe:'',
  bean:'',beanCustom:'',roaster:'',machine:state.me.machine||'',milk:state.me.favMilk||'',dose:'',yield:'',time:'',temp:''};}

const ui={route:'home', filter:'foryou', ovStack:[], profTab:'pours', searchQ:'', obStep:1, cafeF:{open:false,promo:false,top:false}, create:null};
function pushOv(o){ui.ovStack.push(o); renderOverlay();}
function popOv(){ui.ovStack.pop(); renderOverlay(); if(!ui.ovStack.length){renderView(); renderAppbar();}}

function scoreFromQ(q){const b=3.6+q*6; return{total:b.toFixed(1),
  symmetry:clamp(b+(q>.7?.3:-.4),0,10).toFixed(1),contrast:clamp(b-.2,0,10).toFixed(1),definition:clamp(b+(q>.8?.2:-.2),0,10).toFixed(1)};}
function avatar(uid,cls=''){const u=USERS[uid]||{name:'☕',color:'var(--crema)'}; return `<div class="avatar ${cls}" style="background:${u.color}">${initials(u.name)}</div>`;}
function cafeThumb(c){return `<div class="cafe-thumb" style="background:${c.color}">${initials(c.name)}</div>`;}
const allPosts=()=>[...state.posts,...(state.myGallery||[])];
const myPosts=()=>allPosts().filter(p=>p.user==='me');
const postLink=id=>location.href.split('#')[0]+'#p/'+id;

function renderAppbar(){
  const bar=$('#appbar');
  const unread=state.notifications.some(n=>!n.read);
  const bell=`<button class="iconbtn" data-action="open-notifs" aria-label="Notifications">${icon('bell',20)}${unread?'<span class="ndot"></span>':''}</button>`;
  if(ui.route==='home') bar.innerHTML=`<div class="title">${logoMark()} Crema</div><div class="actions"><div class="streak" title="Day streak">${icon('bolt',15)} ${state.streak}</div>${bell}</div>`;
  else if(ui.route==='explore') bar.innerHTML=`<div class="title">Explore</div><div class="actions">${bell}</div>`;
  else if(ui.route==='cafes') bar.innerHTML=`<div class="title">Cafés</div><div class="actions"><div class="streak" style="background:var(--pm1);border-color:var(--pm2);color:var(--green)">📍 ${esc(USERS.me.city)}</div>${bell}</div>`;
  else if(ui.route==='profile') bar.innerHTML=`<div class="title">Profile</div><div class="actions"><button class="iconbtn" data-action="open-settings" aria-label="Settings">${icon('gear',20)}</button></div>`;
}

/* ----- recipe helpers (no fabricated defaults) ----- */
function recipeRows(r){
  if(!r) return [];
  const rows=[]; const bean=[r.bean,r.roaster].filter(Boolean).join(' · ');
  if(bean) rows.push(['bean','Bean',bean]);
  if(r.machine) rows.push(['mach','Machine / brewer',r.machine]);
  if(r.milk) rows.push(['h','Milk',r.milk]);
  if(r.dose) rows.push(['h','Dose in',r.dose]);
  if(r.yield) rows.push(['h','Yield out',r.yield]);
  if(r.time) rows.push(['h','Time',r.time]);
  if(r.temp) rows.push(['h','Temp',r.temp]);
  return rows;
}
function recipePanel(r){
  const rows=recipeRows(r); if(!rows.length) return '';
  return `<div class="recipe-grid">${rows.map(x=>x[0]==='bean'?`<div class="recipe-bean">🫘 <div><span>${x[1]}</span><b>${esc(x[2])}</b></div></div>`:x[0]==='mach'?`<div class="recipe-mach"><span>${x[1]}</span><b>${esc(x[2])}</b></div>`:`<div><span>${x[1]}</span><b>${esc(x[2])}</b></div>`).join('')}</div>`;
}
const recipeBtnLabel=r=>(r.dose&&r.yield)?`Recipe · ${r.dose} in → ${r.yield} out`:'Recipe';

      <button class="act" data-action="open-post" data-id="${p.id}" aria-label="Comments">${icon('chat',22)} ${p.comments.length}</button>

    <div class="p-body">

/* ----- search ----- */
function searchHTML(q){
  const ql=q.trim().toLowerCase(); if(!ql) return '';
  const users=Object.values(USERS).filter(u=>u.id!=='me'&&(u.name+' '+u.handle+' '+u.city).toLowerCase().includes(ql));
  const beans=BEANS.filter(b=>(b.n+' '+b.c+' '+b.notes.join(' ')).toLowerCase().includes(ql));
  const cbeans=state.customBeans.filter(n=>n.toLowerCase().includes(ql));
  const cafes=CAFES.filter(c=>(c.name+' '+c.area+' '+c.spec).toLowerCase().includes(ql));
  const posts=allPosts().filter(p=>((p.caption||'')+' '+(p.drink||'')+' '+(p.pattern||'')+' '+((p.recipe&&p.recipe.bean)||'')).toLowerCase().includes(ql));
  let h=`<div class="section-h" style="margin-top:10px"><h2>Results for “${esc(q)}”</h2><a data-action="clear-search">Clear</a></div>`;
  if(users.length) h+=`<div class="lb" style="margin-bottom:14px">${users.map(u=>`<div class="lb-row click" data-action="open-user" data-id="${u.id}">${avatar(u.id)}
    <div class="who" style="flex:1"><b>${u.name}</b><span>${u.handle} · ${u.city}</span></div><span class="lvlchip">Lv${u.level}</span></div>`).join('')}</div>`;
  if(beans.length||cbeans.length) h+=`<div class="chips" style="margin-bottom:14px">${beans.map(b=>`<span class="chip tag" data-action="open-bean" data-id="${esc(b.n)}">${flag[b.c]||'🫘'} ${b.n}</span>`).join('')}${cbeans.map(n=>`<span class="chip">🫘 ${esc(n)} <small style="color:var(--muted)">yours</small></span>`).join('')}</div>`;
  if(cafes.length) h+=cafes.map(cafeCard).join('');
  if(posts.length) h+=`<div class="grid" style="margin-bottom:14px">${posts.map(p=>gcell(p.pattern,p.quality,p.id,p.img)).join('')}</div>`;
  if(!users.length&&!beans.length&&!cbeans.length&&!cafes.length&&!posts.length) h+=`<div class="empty"><div class="big">🔍</div>No matches for “${esc(q)}”.<br>Try a name, bean, café or drink.</div>`;
  return h;
}

function computeBadges(){
  const mine=myPosts(), n=mine.length, pats=p=>mine.filter(x=>x.pattern===p).length;
  const beansN=BEANS.length+state.customBeans.length;
  const countries=new Set(BEANS.map(b=>b.c)).size;
  return [
    {i:'☕',n:'First pour',d:'Post your first coffee',e:n>0},

function renderOverlay(){

  ov.innerHTML =
    T==='post'?overlayPost(top.id):

    T==='user'?overlayUser(top.id):
    T==='notifs'?overlayNotifs():

    T==='tag'?overlayTag(top.id):

    T==='challenges'?overlayChallenges():

/* ============================================================ ACTIONS */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t) return;
  const a=t.dataset.action, id=t.dataset.id;
  switch(a){
    case 'nav': ui.route=t.dataset.r; ui.ovStack=[]; render(); break;
    case 'filter': ui.filter=t.dataset.f; renderView(); break;
    case 'open-post': pushOv({type:'post',id}); break;
    case 'open-cafe': pushOv({type:'cafe',id}); break;
    case 'open-bean':{ if(BEANS.find(b=>b.n===id)) pushOv({type:'bean',id}); else toast('No details for that bean yet'); break;}
    case 'open-user':{ if(!id)break; if(id==='me'){ui.ovStack=[]; ui.route='profile'; render();} else pushOv({type:'user',id}); break;}
    case 'open-notifs':{ const had=state.notifications.some(n=>!n.read); state.notifications.forEach(n=>n.read=true); if(had){save(); renderAppbar();} pushOv({type:'notifs'}); break;}
    case 'notif-go':{ const n=state.notifications[+t.dataset.idx]; if(!n)break;
      if(n.post&&findPost(n.post)) pushOv({type:'post',id:n.post});
      else if(n.challenge) pushOv({type:'challenge',id:n.challenge});
      else if(n.cafe) pushOv({type:'cafe',id:n.cafe});
      else if(n.u) pushOv({type:'user',id:n.u}); break;}
    case 'open-menu': pushOv({type:'menu',id}); break;
    case 'open-tag': pushOv({type:'tag',id}); break;
    case 'open-challenge': pushOv({type:'challenge',id}); break;
    case 'open-challenges': pushOv({type:'challenges'}); break;
    case 'open-board': pushOv({type:'board'}); break;
    case 'open-flist': pushOv({type:'flist',id}); break;
    case 'open-scoring': pushOv({type:'scoring'}); break;
    case 'open-settings': pushOv({type:'settings'}); break;
    case 'open-create': ui.create=freshCreate(); pushOv({type:'create'}); break;
    case 'close-ov': popOv(); break;
    case 'clear-search':{ ui.searchQ=''; renderView(); break;}

    case 'like': toggleLike(id); break;
    case 'save': toggleSave(id); break;
    case 'follow': toggleFollow(id); break;
    case 'follow-cafe': state.cafeFollow[id]=!state.cafeFollow[id]; save(); renderOverlay(); toast(state.cafeFollow[id]?'Following café ☕':'Unfollowed'); break;
    case 'recipe':{const el=$('#rp-'+id); if(el){el.classList.toggle('open'); const o=el.classList.contains('open'); t.innerHTML=t.innerHTML.replace(o?'▾':'▴',o?'▴':'▾');} break;}
    case 'join':{ state.challenges[id]=!state.challenges[id]; save(); renderView();
      const top=ui.ovStack[ui.ovStack.length-1]; if(top&&(top.type==='challenge'||top.type==='challenges')) renderOverlay();
      toast(state.challenges[id]?'Joined challenge! 🎯':'Left challenge'); break;}
    case 'vote': if(!state.duelVote){state.duelVote=t.dataset.side; save(); renderView(); toast('Vote counted ✓');} break;
    case 'ptab': ui.profTab=t.dataset.t; renderView(); break;

    case 'submit-entry': pushOv({type:'picker',id}); break;
    case 'pick-entry':{ const ch=t.dataset.ch; state.challengeSubs[ch]=id; if(!state.challenges[ch])state.challenges[ch]=true; save();
      ui.ovStack.pop(); renderOverlay(); toast('Entry submitted! 🎯'); break;}

    case 'cmt-like':{ const p=findPost(t.dataset.pid); const c=p&&p.comments[+t.dataset.idx]; if(!c)break;
      c.likedByMe=!c.likedByMe; c.likes=(c.likes||0)+(c.likedByMe?1:-1); save();
      t.classList.toggle('on',c.likedByMe); t.innerHTML=icon(c.likedByMe?'heartF':'heart',15)+'<span>'+(c.likes||'')+'</span>'; break;}
    case 'cmt-reply':{ const inp=$('#cmt-input'); if(inp){inp.value='@'+(t.dataset.handle||'').replace('@','')+' '; inp.focus();} break;}
    case 'add-cmt': addComment(id); break;

    case 'share-post': sharePost(id); break;
    case 'menu-copy': copyText(postLink(id),'Link copied 🔗'); popOv(); break;
    case 'menu-save': toggleSave(id); popOv(); break;
    case 'menu-report': popOv(); toast('Reported — thanks for keeping Crema kind 🙏'); break;
    case 'brew': brewAgain(id); break;
    case 'directions':{ const c=CAFES.find(x=>x.id===id); if(!c)break;
      const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.name+', '+c.area+', '+c.city);
      let w=null; try{w=window.open(url,'_blank','noopener');}catch(err){}
      if(!w) copyText(url,'Maps link copied 🔗'); break;}

    case 'cafe-filter': ui.cafeF[t.dataset.f]=!ui.cafeF[t.dataset.f]; renderView(); break;
    case 'cpat':{ syncCreate(); ui.create.pattern=(ui.create.pattern===t.dataset.p)?null:t.dataset.p; renderOverlay(); break;}
    case 'csource':{ syncCreate(); ui.create.source=t.dataset.s; if(t.dataset.s==='home')ui.create.cafe=''; renderOverlay(); break;}
    case 'submit-post': submitPost(); break;

    case 'set-theme': state.theme=t.dataset.t; save(); applyTheme(); renderOverlay(); break;
    case 'save-profile':{ const g=i=>{const el=$('#'+i); return el?el.value:'';};
      state.me.name=(g('sp-name')||state.me.name).trim(); state.me.bio=g('sp-bio'); state.me.city=g('sp-city').trim(); state.me.machine=g('sp-machine'); state.me.favMilk=g('sp-milk')||state.me.favMilk;
      save(); applyMe(); popOv(); toast('Profile updated ✓'); break;}

    case 'ob-next': syncOb(); ui.obStep=Math.min(3,(ui.obStep||1)+1); renderOverlay(); break;
    case 'ob-back': syncOb(); ui.obStep=Math.max(1,(ui.obStep||1)-1); renderOverlay(); break;
    case 'ob-follow': state.follows[id]=!state.follows[id]; save(); renderOverlay(); break;
    case 'ob-skip': case 'ob-finish': syncOb(); state.onboarded=true; save(); applyMe(); ui.ovStack=[]; render();
      toast(a==='ob-finish'?'Welcome to Crema ☕':'You can finish setup in Settings'); break;

    case 'reset': if(confirm('Reset the demo to its starting state?')){localStorage.removeItem(KEY); load(); applyMe(); applyTheme();
      ui.ovStack=[]; ui.profTab='pours'; ui.filter='foryou'; ui.searchQ=''; ui.route='home'; render();
      ui.obStep=1; pushOv({type:'onboard'}); toast('Demo reset ☕');} break;
    case 'toast': toast(t.dataset.msg||'Coming soon'); break;
    default: break;
  }
});

  const n=g('ob-name'); if(n!==undefined&&n.trim()) state.me.name=n.trim();
  const c=g('ob-city'); if(c!==undefined&&c.trim()) state.me.city=c.trim();

function handleUpload(file){
  if(!file.type||!file.type.startsWith('image/')){toast('That file isn\'t an image'); return;}
  const reader=new FileReader();
  reader.onload=ev=>{const img=new Image();
    img.onload=()=>{const max=1080; let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      syncCreate(); ui.create.img=cv.toDataURL('image/jpeg',0.82); renderOverlay(); toast('Photo added 📸');};
    img.onerror=()=>toast('Could not read that image'); img.src=ev.target.result;};
  reader.onerror=()=>toast('Could not read that file');
  reader.readAsDataURL(file);
}

function toggleLike(id){
  const p=findPost(id); if(!p) return;
  p.likedByMe=!p.likedByMe; p.likes+=p.likedByMe?1:-1; save();
  $$('[data-action="like"][data-id="'+id+'"]').forEach(b=>{b.classList.toggle('liked',p.likedByMe); b.innerHTML=icon(p.likedByMe?'heartF':'heart',22)+' <span class="cnt">'+fmt(p.likes)+'</span>';});
  if(p.likedByMe){const hp=$('#hp-'+id); if(hp){hp.classList.remove('go'); void hp.offsetWidth; hp.classList.add('go');}}
}
function toggleSave(id){
  const p=findPost(id); if(!p) return; p.saved=!p.saved; save();
  $$('[data-action="save"][data-id="'+id+'"]').forEach(b=>{b.classList.toggle('saved',p.saved); b.innerHTML=icon(p.saved?'saveF':'save',22);});
  toast(p.saved?'Saved to your collection 🔖':'Removed from saved');
}
function toggleFollow(id){
  const on=state.follows[id]=!state.follows[id]; save();
  $$('[data-action="follow"][data-id="'+id+'"]').forEach(b=>{
    b.classList.toggle('on',on);
    if(b.classList.contains('btn')) b.classList.toggle('ghost',on);
    b.textContent=on?'Following':'Follow';});
  toast(on?('Following '+USERS[id].name.split(' ')[0]+' ☕'):'Unfollowed');
}
function addComment(id){
  const inp=$('#cmt-input'); if(!inp) return; const text=inp.value.trim(); if(!text) return;
  const p=findPost(id); if(!p) return; p.comments.push({u:'me',t:text,ago:'now',likes:0}); save();
  const list=$('#cmt-list'); if(list){if(list.querySelector('.empty')) list.innerHTML=''; list.insertAdjacentHTML('beforeend',commentRow({u:'me',t:text,ago:'now',likes:0},p.id,p.comments.length-1));}
  inp.value=''; toast('Comment added 💬');
}
function brewAgain(id){
  const p=findPost(id); if(!p) return; const r=p.recipe||{};
  ui.create=freshCreate();
  Object.assign(ui.create,{drink:p.drink||ui.create.drink, pattern:p.pattern||ui.create.pattern,
    bean:r.bean||'', roaster:r.roaster||'', machine:r.machine||ui.create.machine, milk:r.milk||ui.create.milk,
    dose:r.dose||'', yield:r.yield||'', time:r.time||'', temp:r.temp||''});
  ui.ovStack=[]; pushOv({type:'create'}); toast('Recipe loaded — brew it again ☕');
}
function sharePost(id){
  const p=findPost(id); if(!p) return; const link=postLink(id);
  if(navigator.share){ navigator.share({title:'Crema',text:(p.caption||'A pour on Crema'),url:link}).catch(()=>{}); }
  else copyText(link,'Link copied 🔗');
}
function copyText(text,msg){
  const done=()=>toast(msg||'Copied ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); }
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  try{const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();}
  catch(e){toast('Couldn\'t copy here — long-press the post instead');}
}
function submitPost(){
  syncCreate(); const c=ui.create; const T=v=>(v||'').trim();
  const drink=c.drink||'Cappuccino', isArt=!!DRINK_ART[drink];
  const caption=T(c.caption)||`${drink} ☕`;
  const cafe=(c.source==='cafe'&&c.cafe)?CAFES.find(x=>x.id===c.cafe):null;
  const recipe={};
  if(cafe){
    // café-sourced: bean from their list, roaster & machine from the café
    if(T(c.bean)) recipe.bean=T(c.bean);
    recipe.roaster=cafe.menu.roaster;
    recipe.machine=cafe.menu.machine;
    if(HAS_MILK.has(drink)&&c.milk) recipe.milk=c.milk;
  }else{
    let bean=c.bean===ADD_BEAN?T(c.beanCustom):T(c.bean);
    if(c.bean===ADD_BEAN && bean && !BEAN_LIST.includes(bean) && !state.customBeans.includes(bean)) state.customBeans.push(bean);
    if(bean) recipe.bean=bean;
    if(c.roaster) recipe.roaster=(c.roaster==='Other / home roast'?'home roast':c.roaster);
    if(c.machine) recipe.machine=c.machine;
    if(HAS_MILK.has(drink)&&c.milk) recipe.milk=c.milk;
    if(T(c.dose)) recipe.dose=T(c.dose);
    if(T(c.yield)) recipe.yield=T(c.yield);
    if(T(c.time)) recipe.time=T(c.time);
    if(T(c.temp)) recipe.temp=T(c.temp);
  }
  const hasRecipe=Object.keys(recipe).length>0;
  const np=post({user:'me',drink,art:isArt,pattern:isArt?(c.pattern||null):null,quality:isArt?.85:null,
    cafe:cafe?cafe.name:undefined,img:c.img,ago:'now',caption,recipe:hasRecipe?recipe:null,likes:0,comments:[]});
  state.posts.unshift(np); if(state.streak<8) state.streak++; save();
  ui.ovStack=[]; ui.route='home'; ui.filter='foryou'; render();
  setTimeout(()=>toast(c.img?'Posted! Streak kept 🔥':'Posted ☕ (add a photo next time)'),120);
}

/* ---------- theme ---------- */
const mqDark=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t=state.theme||'auto';
  const dark = t==='dark' || (t==='auto' && mqDark.matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}
if(mqDark.addEventListener) mqDark.addEventListener('change',()=>{ if((state.theme||'auto')==='auto') applyTheme(); });

/* ---------- toast & clock ---------- */
let toastT; function toast(msg){const el=$('#toast'); el.innerHTML=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1900);}
function tick(){const d=new Date(); $('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
setInterval(tick,10000);

/* ---------- boot ---------- */
load(); applyMe(); applyTheme(); tick(); render();
if(!state.onboarded){ ui.obStep=1; pushOv({type:'onboard'}); }
else { const m=location.hash.match(/#p\/(p\d+)/); if(m&&findPost(m[1])) pushOv({type:'post',id:m[1]}); }
if('serviceWorker' in navigator && (location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  let _reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_reloading)return; _reloading=true; location.reload(); });
  try{ navigator.serviceWorker.register('./sw.js').then(r=>{ if(r&&r.update) r.update(); }).catch(()=>{}); }catch(e){}
}
</script>
