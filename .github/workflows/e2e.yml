# ============================================================
# End-to-end — the four flows, against staging, before production.
#
# This is the step that makes "staging first" mean something. Until it
# existed, staging was a database nobody looked at: the migrations were
# applied to it and that was the end of the verification. Here the tag's
# schema goes to staging, and then the tag's actual code is driven
# through sign-in, posting a pour, liking someone else's and redeeming
# Premium against it — in a browser, over the network, reading the rows
# back out of Postgres afterwards.
#
# Called by release.yml between CI and the production migration, so a
# red run means production is never touched.
#
# ⚠️ NEVER point this at production. e2e/support/env.js refuses, twice,
# and that refusal is load-bearing: these tests sign up and post.
#
# It gates itself on its own prerequisite rather than on somebody
# remembering a switch. The one thing it cannot work around is a staging
# project that confirms email addresses by mail — it could not mint the
# accounts it runs as — so it ASKS staging, using the same code the suite
# uses, and skips with a warning if the answer is no. That is a condition
# which can only become true deliberately, so "ready" is a fact rather
# than a proxy for one.
#
# The off switch is the repository variable CREMA_E2E=false, for the day
# this is in the way of a release that has to go out. There is no "on"
# to set: a variable that has to be remembered is the class of thing this
# whole phase exists to stop relying on.
# ============================================================
name: E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flows:
    name: four flows → staging
    runs-on: ubuntu-latest
    env:
      STAGING_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'qqyurcqrikqvqgbjcjhg' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Two ways out, and neither of them is "somebody forgot".
      #
      #   · CREMA_E2E=false — the deliberate off switch.
      #   · staging cannot mint accounts — asked, not assumed, using
      #     assertAutoConfirm() from the suite itself so the check and
      #     the requirement can never drift apart.
      #
      # Either way this job SUCCEEDS and warns. A skipped job would make
      # every job downstream of it skip too, and downstream of here is
      # the production release.
      - name: should the flows run against staging?
        id: gate
        working-directory: e2e
        run: |
          set -uo pipefail
          if [ "${{ vars.CREMA_E2E }}" = "false" ]; then
            echo "on=no" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E is switched off (repository variable CREMA_E2E=false). This"
            echo "::warning::release is going to production without the four flows being run."
            exit 0
          fi
          if [ -n "${{ secrets.CREMA_E2E_EMAIL }}" ]; then
            echo "accounts are supplied by secret — nothing to mint."
            echo "on=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "import('./support/env.js').then(m=>m.assertAutoConfirm()).catch(e=>{console.error(e.message);process.exit(1)})"; then
            echo "on=yes" >> "$GITHUB_OUTPUT"
          else
            echo "on=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging cannot mint the accounts these flows need — see the message"
            echo "::warning::above. Skipping, so this release goes to production unverified."
          fi

      # Staging gets the tag's schema before the tag's code is driven at
      # it — otherwise a release whose migration is the whole point would
      # be tested against last week's database. Skipped, loudly, if the
      # password to do it with is not set: a stale staging is worth
      # knowing about but is not worth failing a release over.
      - name: migrations → staging
        if: steps.gate.outputs.on == 'yes'
        working-directory: platform
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::warning::SUPABASE_STAGING_DB_PASSWORD is not set — staging keeps whatever schema it has."
            exit 0
          fi
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin supabase
          supabase link --project-ref "$STAGING_REF"
          supabase migration list --linked
          supabase db push --linked

      - name: playwright
        if: steps.gate.outputs.on == 'yes'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # devserver.py is started by playwright.config.js itself, from the
      # repo root. python3 is on the runner already.
      - name: the four flows
        if: steps.gate.outputs.on == 'yes'
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.on == 'yes'
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
