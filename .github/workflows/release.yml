# ============================================================
# Release — schema and code ship together, in that order.
#
# Until this existed, a push to main deployed the site immediately while
# migrations were pasted into the SQL editor by hand, minutes or days
# apart. The two could not be made atomic, which is the whole reason
# optionalColumns() exists in src/data/supabase.js.
#
# Ordering is the point, and it is one-way:
#
#   verify  →  migrate (production)  →  deploy (crema-app.com)
#
# Old code must never meet a new column it does not know about, and new
# code must never meet a missing one. Migrations therefore run first;
# a failed migration means the site is not deployed at all, so the live
# app keeps talking to the schema it was written against.
#
# ⚠️ The standing rule from brain/13-infrastructure-plan.md still holds:
#    take a fresh dump immediately before every migration against
#    production. `~/crema-backups/daily-dump.sh`, about twelve seconds.
#    Put a required reviewer on the `production` environment and that
#    approval click becomes the place you do it.
#
#   git tag -a v1.33 -m "what changed"   &&   git push origin v1.33
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  # The escape hatch: re-run a deploy without minting a new tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Same file the pull requests run. A tag is not evidence.
  verify:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: migrations → production
    needs: verify
    runs-on: ubuntu-latest
    # Put a required reviewer on this environment in the GitHub UI. It is
    # the last stop before production and the natural place to take the
    # dump. Without a reviewer it simply runs.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # From platform/, never the repo root: the CLI locates a project by
      # looking for `supabase/` next to the working directory, and running
      # it at the root leaves a stray supabase/.temp — which the root is
      # the web root, so it would be published.
      - name: apply pending migrations
        working-directory: platform
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'diabtvahplwoipvrprvb' }}
        run: |
          set -euo pipefail
          if ! ls supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "::notice::No supabase/migrations yet — step 1.3 has not landed."
            echo "The 26 step-*.sql files are still applied by hand. Deploying the site only."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::supabase/migrations exists, so this release has schema to apply,"
            echo "::error::but the credentials to apply it are missing. Set both repository"
            echo "::error::secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD."
            echo "::error::Deploying the site without them would put new code in front of an"
            echo "::error::old schema, which is the exact thing this workflow exists to stop."
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF"
          echo "--- what production has, and what this tag adds ---"
          supabase migration list --linked
          supabase db push --linked

  deploy:
    name: crema-app.com
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The repo root IS the web root, so the site is the commit. Built
      # from `git archive` rather than the working directory on purpose:
      # it can only ever contain tracked files, so an untracked keystore
      # or a production dump cannot be published by accident.
      #
      # .github is dropped because GitHub Pages never served it — verified
      # against the live site, which 404s on /.github/ and 200s on
      # /.well-known/, /platform/ and /README.md. This reproduces that.
      - name: assemble the site
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          rm -rf "$RUNNER_TEMP/site/.github"
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/CNAME"
          test -f "$RUNNER_TEMP/site/.nojekyll"
          test -f "$RUNNER_TEMP/site/.well-known/assetlinks.json"
          echo "files: $(find "$RUNNER_TEMP/site" -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
