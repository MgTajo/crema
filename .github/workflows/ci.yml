# ============================================================
# CI — the green light Crema never had.
#
# Both test files existed before this workflow and both were run by
# hand, which meant they were run when somebody remembered. Everything
# here is a command you can also type yourself; nothing is CI-only.
#
# The SQL job is the one that matters. Migrations are applied to
# production by hand against a database whose backups live on one
# laptop, so the chain's first execution must never be the real one.
# ============================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this whole file before it touches production. The
  # tag might point at a commit that never went through a pull request.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not latest: `--experimental-strip-types` is documented and
      # stable there, and the webpush test imports a .ts module.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: streak — 20 assertions
        run: node src/domain/streak.test.mjs

      # The one bug in step 4.1 that would be catastrophic and silent: a
      # store build pointed at STAGING. Capacitor serves from localhost,
      # localhost resolves to staging, and the resulting app looks
      # completely normal. Nine assertions, three of which are that the
      # web app's own resolution did not move.
      - name: config — a native build talks to production
        run: node src/config.test.mjs

      - name: web push — RFC 8291 / 8292 vectors
        run: node --experimental-strip-types platform/supabase/functions/send-push/webpush.test.mjs

      # The push dictionary in step-1.32.sql is generated from
      # src/i18n.de.js, never typed. This is the only thing that notices
      # when the two drift apart.
      - name: push dictionary matches src/i18n.de.js
        run: node platform/supabase/gen-push-i18n.mjs --check

      # sw.js's precache list and cache name are generated, for the same
      # reason: a file that is missing from ASSETS is never precached and
      # never revalidated, and neither failure shows up anywhere. This is
      # what notices that somebody added a module and did not re-run it.
      - name: sw.js precache list is current
        run: node platform/gen-sw-assets.mjs --check

      # The Capacitor shell's www/ is staged from the same rules, and the
      # staging script refuses to copy signing material into a bundle
      # that ships to two app stores. Running it in CI is what proves the
      # allowlist still resolves and the audit still passes — an .ipa and
      # an .apk are both zip files, so this is the check that matters
      # most in the whole workflow.
      - name: capacitor — the shell stages, and stages nothing secret
        run: node platform/capacitor/sync.mjs

      # configure-native.mjs re-applies Crema's own settings to the
      # generated native projects — deep links, permissions, icons,
      # version, signing. It replaced a README checklist, so the thing
      # that has to hold is that it is IDEMPOTENT: running it twice must
      # change nothing, or --check is permanently red and the diff grows
      # forever. That is exactly the bug the first version had.
      # ios/ and android/ are git-ignored, so there is nothing to patch
      # here — this asserts the script parses and its version maths is
      # right, which is what CI can see.
      - name: capacitor — the native configurator is sound
        run: node -e "import('./platform/capacitor/configure-native.mjs').then(m=>{const v=m.version();if(!(v.code>5))throw new Error('versionCode '+v.code+' must exceed the TWA'\'s 5');console.log('versionCode',v.code,'from',v.name)})"

  sql:
    name: migration chain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          # Berlin, deliberately not UTC. run.sh also sets PGTZ per
          # session, which is what actually guarantees it.
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # The runner ships psql/pg_dump 16, and pg_dump refuses a server
      # newer than itself: "aborting because of server version mismatch".
      # baseline-check.sh dumps the two databases it compares, so it needs
      # a 17 client to talk to the 17 service container.
      - name: postgresql client 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          psql --version
          pg_dump --version

      # The same script the founder runs on the laptop, pointed at the
      # service container instead of a cluster it builds itself. It
      # loads stub.sql, schema.sql and every step-*.sql in order, then
      # gives each *-test.sql its own copy of the result.
      - name: chain + every SQL test
        working-directory: platform
        env:
          CREMA_TEST_HOST: localhost
          CREMA_TEST_PORT: '5432'
          CREMA_TEST_USER: postgres
          PGPASSWORD: postgres
        run: |
          tests=$(cd supabase/local-test && ls *-test.sql | tr '\n' ' ')
          echo "tests: $tests"
          ./supabase/local-test/run.sh $tests

      # The baseline is a dump of production, so it is production by
      # construction — as long as it still loads and still describes the
      # same database the step files build. This is the Docker-free
      # stand-in for `supabase db diff`.
      - name: baseline still builds the same database
        working-directory: platform
        env:
          CREMA_TEST_HOST: localhost
          CREMA_TEST_PORT: '5432'
          CREMA_TEST_USER: postgres
          PGPASSWORD: postgres
        run: |
          if ! ls supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "no baseline yet — step 1.3 has not landed."
            exit 0
          fi
          ./supabase/local-test/baseline-check.sh
